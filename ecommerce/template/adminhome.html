<!DOCTYPE html>
<html>
<head>

    <title>Admin Home</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#f5f1ee;
}
.sidebar{
    width:220px;
    height:100vh;
    background:#6b0f1a;
    color:white;
    position:fixed;
    top:0;
    left:0;
    padding:20px;
    overflow-y:auto;
}

.sidebar h2{
    text-align:center;
    margin-bottom:40px;
    font-family:Georgia, "Times New Roman", serif;
}

.sidebar a{
    display:block;
    color:white;
    text-decoration:none;
    padding:12px;
    margin:10px 0;
    border-radius:6px;
    transition:.3s;
}

.sidebar a:hover{
    background:rgba(255,255,255,.15);
    padding-left:20px;
}
.main{
    margin-left:220px;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px;
    background:linear-gradient(to right,#fff5f5,#fdf2f2);
}

.design-box{
    width:100%;
    max-width:950px;
    min-height:500px;
    background:white;
    border-radius:25px;
    box-shadow:0 10px 30px rgba(0,0,0,.1);
    position:relative;
    overflow:hidden;
}

.circle1{
    width:300px;
    height:300px;
    background:#6b0f1a;
    border-radius:50%;
    position:absolute;
    top:-100px;
    right:-100px;
    opacity:.1;
}

.circle2{
    width:220px;
    height:220px;
    background:#6b0f1a;
    border-radius:50%;
    position:absolute;
    bottom:-80px;
    left:-80px;
    opacity:.1;
}

.content{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    text-align:center;
    width:90%;
}

.content h1{
    font-size:55px;
    color:#6b0f1a;
    margin-bottom:20px;
    font-family:Georgia, "Times New Roman", serif;
}

.content p{
    font-size:22px;
    color:#666;
    line-height:1.6;
}
@media(max-width:768px){

.sidebar{
    position:relative;
    width:100%;
    height:auto;
    display:flex;
    flex-direction:column;
    align-items:center;
}

.sidebar h2{
    margin-bottom:20px;
}

.sidebar a{
    width:100%;
    text-align:center;
}

.main{
    margin-left:0;
    padding:25px 15px;
}

.design-box{
    min-height:420px;
}

.content h1{
    font-size:40px;
}

.content p{
    font-size:18px;
}

.circle1{
    width:220px;
    height:220px;
}

.circle2{
    width:170px;
    height:170px;
}

}
@media(max-width:480px){

.sidebar{
    padding:15px;
}

.sidebar h2{
    font-size:24px;
}

.sidebar a{
    font-size:15px;
    padding:10px;
}

.main{
    padding:15px;
}

.design-box{
    min-height:350px;
    border-radius:15px;
}

.content h1{
    font-size:30px;
}

.content p{
    font-size:16px;
}

.circle1{
    width:170px;
    height:170px;
    top:-60px;
    right:-60px;
}

.circle2{
    width:120px;
    height:120px;
    bottom:-40px;
    left:-40px;
}

}
</style>

</head>

<body>
<div class="sidebar">

    <h2>Admin Panel</h2>

    <a href="{% url 'adminhome' %}">
        Home
    </a>

    <a href="{% url 'addproduct' %}">
        Add Product
    </a>

    <a href="{% url 'adminproducts' %}">
        View Products
    </a>
    <a href="{% url 'adminorders' %}">Orders</a>

    <a href="{% url 'logout' %}">
        Logout
    </a>

</div>
<div class="main">

    <div class="design-box">

        <div class="circle1"></div>

        <div class="circle2"></div>

        <div class="content">

            <h1>
                Welcome Admin
            </h1>

            <p>
                Manage your ecommerce website easily
            </p>

        </div>

    </div>

</div>

</body>
</html>
