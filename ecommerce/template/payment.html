<!DOCTYPE html>
<html>
<head>

    <title>Payment</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#fdf9f6;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
}

.payment-box{
    width:100%;
    max-width:420px;
    background:white;
    padding:40px;
    border-radius:12px;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

h1{
    text-align:center;
    color:#6b0f1a;
    margin-bottom:30px;
    font-size:32px;
    font-family:Georgia, "Times New Roman", serif;
}

.method{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:20px;
    font-size:18px;
    color:#444;
}

.method input[type="radio"]{
    width:18px;
    height:18px;
    cursor:pointer;
}

button{
    width:100%;
    padding:14px;
    border:none;
    background:#6b0f1a;
    color:white;
    border-radius:6px;
    font-size:17px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    opacity:0.9;
}
@media(max-width:768px){

.payment-box{
    max-width:380px;
    padding:30px;
}

h1{
    font-size:28px;
}

.method{
    font-size:17px;
}

button{
    font-size:16px;
}

}
@media(max-width:480px){

body{
    padding:15px;
}

.payment-box{
    padding:25px 20px;
}

h1{
    font-size:24px;
    margin-bottom:25px;
}

.method{
    font-size:16px;
    margin-bottom:18px;
}

.method input[type="radio"]{
    width:16px;
    height:16px;
}

button{
    padding:12px;
    font-size:15px;
}

}
</style>

</head>

<body>

<div class="payment-box">

    <h1>Select Payment Method</h1>

    <form action="{% url 'checkout' %}" method="POST">

        {% csrf_token %}

        <div class="method">

            <input type="radio"
                   name="payment"
                   value="Cash On Delivery"
                   required>

            Cash On Delivery

        </div>

        <div class="method">

            <input type="radio"
                   name="payment"
                   value="UPI">

            UPI

        </div>

        <div class="method">

            <input type="radio"
                   name="payment"
                   value="Card Payment">

            Card Payment

        </div>

        <button type="submit">

            Pay Now

        </button>

    </form>

</div>

</body>
</html>
