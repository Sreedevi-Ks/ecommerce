<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - Aadhya Vastra</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#fdf9f6;
    display:flex;
    flex-direction:column;
    min-height:100vh;
}

/* Navbar */

.navbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px 60px;
    background:#6b0f1a;
    color:white;
}

.logo{
    font-size:32px;
    font-family:Georgia, serif;
    font-weight:bold;
    line-height:1.1;
}

.nav-links{
    display:flex;
    gap:25px;
}

.nav-links a{
    text-decoration:none;
    color:white;
    font-size:16px;
    transition:0.3s;
}

.nav-links a:hover{
    opacity:0.8;
}

/* Login */

.login-container{
    flex:1;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:40px 20px;
}

.login-box{
    width:100%;
    max-width:400px;
    background:white;
    padding:35px;
    border-radius:12px;
    box-shadow:0 5px 20px rgba(0,0,0,0.1);
}

.login-box h2{
    text-align:center;
    margin-bottom:25px;
    color:#6b0f1a;
    font-family:Georgia, serif;
}

.login-box input{
    width:100%;
    padding:12px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:6px;
    font-size:15px;
}

.login-box button{
    width:100%;
    padding:12px;
    background:#6b0f1a;
    color:white;
    border:none;
    border-radius:6px;
    font-size:16px;
    cursor:pointer;
}

.login-box button:hover{
    opacity:0.9;
}

.login-box p{
    margin-top:18px;
    text-align:center;
    font-size:15px;
}

.login-box a{
    color:#6b0f1a;
    text-decoration:none;
    font-weight:bold;
}

.error{
    color:red;
    text-align:center;
    margin-bottom:15px;
}

/* Footer */

.footer{
    background:#6b0f1a;
    color:white;
    text-align:center;
    padding:18px;
}

/* Responsive */

@media(max-width:768px){

    .navbar{
        flex-direction:column;
        padding:20px;
        gap:15px;
    }

    .logo{
        font-size:30px;
        text-align:center;
    }

    .nav-links{
        flex-wrap:wrap;
        justify-content:center;
        gap:15px;
    }

    .login-box{
        padding:25px;
    }

}

@media(max-width:480px){

    .logo{
        font-size:28px;
    }

    .nav-links{
        flex-direction:column;
        align-items:center;
        gap:10px;
    }

    .login-box h2{
        font-size:28px;
    }

}

</style>

</head>

<body>

<div class="navbar">

    <div class="logo">
        Aadhya<br>Vastra
    </div>

    <div class="nav-links">

        <a href="/">Home</a>

        <a href="{% url 'login' %}">Login</a>

        <a href="{% url 'register' %}">Register</a>

    </div>

</div>

<div class="login-container">

    <div class="login-box">

        <h2>Login</h2>

        {% if error %}
        <p class="error">
            {{ error }}
        </p>
        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <input
                type="text"
                name="email"
                placeholder="Enter Email"
                required>

            <input
                type="password"
                name="password"
                placeholder="Enter Password"
                required>

            <button type="submit">
                Login
            </button>

        </form>

        <p>
            Don't have an account?
            <a href="{% url 'register' %}">
                Register
            </a>
        </p>

    </div>

</div>

<div class="footer">

    © 2026 Aadhya Vastra | All Rights Reserved

</div>

</body>
</html>
