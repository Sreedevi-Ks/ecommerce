<!DOCTYPE html>
<html>
<head>

    <title>My Profile</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#fdf9f6;
}
.navbar{
    background:#6b0f1a;
    padding:18px 50px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    color:white;
    font-size:30px;
    font-family:Georgia, "Times New Roman", serif;
    font-weight:bold;
}

.nav-links{
    display:flex;
    gap:25px;
    flex-wrap:wrap;
}

.nav-links a{
    color:white;
    text-decoration:none;
    font-size:16px;
    transition:0.3s;
}

.nav-links a:hover{
    opacity:0.8;
}
.profile-container{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:85vh;
    padding:40px 20px;
}

.profile-card{
    width:100%;
    max-width:420px;
    background:white;
    padding:40px;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
    text-align:center;
}

.profile-image{
    width:120px;
    height:120px;
    border-radius:50%;
    object-fit:cover;
    margin-bottom:20px;
}

h1{
    color:#6b0f1a;
    margin-bottom:25px;
    font-family:Georgia, "Times New Roman", serif;
}

.info{
    text-align:left;
    margin-top:20px;
}

.info p{
    margin-bottom:15px;
    font-size:17px;
    color:#444;
    word-break:break-word;
}

.label{
    font-weight:bold;
    color:#6b0f1a;
}

.logout-btn{
    width:100%;
    padding:12px;
    border:none;
    background:#6b0f1a;
    color:white;
    border-radius:6px;
    margin-top:25px;
    cursor:pointer;
    font-size:16px;
    transition:0.3s;
}

.logout-btn:hover{
    opacity:0.9;
}
@media(max-width:768px){

.navbar{
    flex-direction:column;
    padding:20px;
    gap:15px;
}

.logo{
    font-size:30px;
    text-align:center;
}

.nav-links{
    justify-content:center;
    gap:15px;
}

.profile-container{
    padding:30px 20px;
}

.profile-card{
    max-width:380px;
    padding:30px;
}

}
@media(max-width:480px){

.navbar{
    padding:18px;
}

.logo{
    font-size:28px;
}

.nav-links{
    flex-direction:column;
    align-items:center;
    gap:10px;
}

.profile-container{
    padding:20px 15px;
}

.profile-card{
    padding:25px 20px;
}

.profile-image{
    width:100px;
    height:100px;
}

h1{
    font-size:28px;
}

.info p{
    font-size:15px;
}

.logout-btn{
    font-size:15px;
    padding:12px;
}

}
</style>

</head>

<body>
<div class="navbar">

    <div class="logo">

        Aadhya Vastra

    </div>

    <div class="nav-links">

        <a href="{% url 'userindex' %}">
            Home
        </a>

        <a href="{% url 'products' %}">
            Products
        </a>

        <a href="{% url 'cart' %}">
            Cart
        </a>

        <a href="{% url 'orders' %}">
            Orders
        </a>

        <a href="{% url 'profile' %}">
            Profile
        </a>

    </div>

</div>
<div class="profile-container">

    <div class="profile-card">

        <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png"
             class="profile-image">

        <h1>My Profile</h1>

        <div class="info">

            <p>

                <span class="label">

                    Email :

                </span>

                {{ user.email }}

            </p>

            <p>

                <span class="label">

                    Email :

                </span>

                {{ user.email }}

            </p>

        </div>

        <a href="{% url 'logout' %}">

            <button class="logout-btn">

                Logout

            </button>

        </a>

    </div>

</div>

</body>
</html>
