<!DOCTYPE html>
<html>
<head>

<title>Add Product</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#f5f1ee;
}
.sidebar{
    width:220px;
    height:100vh;
    background:#6b0f1a;
    color:white;
    position:fixed;
    top:0;
    left:0;
    padding:20px;
    overflow-y:auto;
}

.sidebar h2{
    text-align:center;
    margin-bottom:40px;
    font-family:Georgia, "Times New Roman", serif;
}

.sidebar a{
    display:block;
    color:white;
    text-decoration:none;
    padding:12px 10px;
    margin:10px 0;
    border-radius:6px;
    transition:0.3s;
}

.sidebar a:hover{
    background:rgba(255,255,255,0.15);
}
.main{
    margin-left:220px;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:40px 20px;
}

.container{
    width:100%;
    max-width:500px;
    background:white;
    padding:35px;
    border-radius:12px;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

h1{
    text-align:center;
    color:#6b0f1a;
    margin-bottom:25px;
    font-family:Georgia, "Times New Roman", serif;
}

input,
textarea{
    width:100%;
    padding:12px;
    margin-bottom:18px;
    border:1px solid #ccc;
    border-radius:6px;
    font-size:15px;
    outline:none;
}

input:focus,
textarea:focus{
    border-color:#6b0f1a;
}

textarea{
    resize:vertical;
}

button{
    width:100%;
    padding:14px;
    border:none;
    background:#6b0f1a;
    color:white;
    font-size:16px;
    border-radius:6px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    opacity:0.9;
}
@media (max-width:768px){

.sidebar{
    width:100%;
    height:auto;
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:20px;
}

.sidebar h2{
    margin-bottom:20px;
}

.sidebar a{
    width:100%;
    text-align:center;
}

.main{
    margin-left:0;
    padding:30px 15px;
}

.container{
    max-width:450px;
}

}
@media (max-width:480px){

.sidebar{
    padding:15px;
}

.sidebar h2{
    font-size:24px;
}

.sidebar a{
    font-size:15px;
    padding:10px;
}

.main{
    padding:20px 10px;
}

.container{
    padding:25px 20px;
}

h1{
    font-size:28px;
}

input,
textarea{
    font-size:14px;
    padding:10px;
}

button{
    font-size:15px;
    padding:12px;
}

}
</style>

</head>

<body>
<div class="sidebar">

    <h2>Admin Panel</h2>

    <a href="{% url 'adminhome' %}">Home</a>

    <a href="{% url 'addproduct' %}">Add Product</a>
    <a href="{% url 'adminproducts' %}">View Products</a>

    <a href="{% url 'adminorders' %}">Orders</a>

    <a href="{% url 'logout' %}">Logout</a>

</div>
<div class="main">

    <div class="container">

        <h1>Add Product</h1>

        <form action="{% url 'saveproduct' %}" method="POST">

            {% csrf_token %}

            <input type="text"
                   name="name"
                   placeholder="Product Name"
                   required>

            <input type="number"
                   name="price"
                   placeholder="Product Price"
                   required>

            <textarea name="description"
                      placeholder="Product Description"
                      rows="4"
                      required></textarea>

            <input type="text"
                   name="image"
                   placeholder="Paste Image URL"
                   required>

            <button type="submit">

                Add Product

            </button>

        </form>

    </div>

</div>

</body>
</html>
