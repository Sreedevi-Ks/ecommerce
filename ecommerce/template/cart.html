<!DOCTYPE html>
<html>
<head>

    <title>Cart</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#fdf9f6;
}
.navbar{
    background:#6b0f1a;
    padding:18px 50px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    color:white;
    font-size:30px;
    font-family:Georgia, "Times New Roman", serif;
    font-weight:bold;
    line-height:1.2;
}

.nav-links{
    display:flex;
    gap:25px;
    flex-wrap:wrap;
}

.nav-links a{
    color:white;
    text-decoration:none;
    font-size:16px;
    transition:0.3s;
}

.nav-links a:hover{
    opacity:0.8;
}

/* ================= MAIN ================= */

.main{
    padding:40px;
}

h1{
    text-align:center;
    color:#6b0f1a;
    margin-bottom:40px;
    font-size:38px;
    font-family:Georgia, "Times New Roman", serif;
}
.cart-container{
    display:flex;
    flex-direction:column;
    gap:25px;
}

.cart-card{
    background:white;
    padding:20px;
    border-radius:12px;
    display:flex;
    gap:25px;
    align-items:center;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

.cart-card img{
    width:180px;
    height:180px;
    object-fit:cover;
    border-radius:10px;
}

.cart-info{
    flex:1;
}

.cart-info h2{
    color:#6b0f1a;
    margin-bottom:15px;
}

.cart-info p{
    margin-bottom:10px;
    font-size:17px;
}
.quantity-box{
    margin-top:15px;
    display:flex;
    align-items:center;
    gap:15px;
}

.qty-btn{
    width:40px;
    height:40px;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#6b0f1a;
    color:white;
    text-decoration:none;
    border-radius:5px;
    font-size:20px;
}

.qty-number{
    font-size:20px;
    font-weight:bold;
}

.total{
    margin-top:15px;
    font-size:20px;
    font-weight:bold;
    color:#6b0f1a;
}

.remove-btn{
    display:inline-block;
    margin-top:15px;
    padding:10px 20px;
    background:red;
    color:white;
    text-decoration:none;
    border-radius:6px;
}

.remove-btn:hover{
    opacity:0.9;
}
.checkout-box{
    margin-top:50px;
    background:white;
    padding:30px;
    border-radius:12px;
    text-align:center;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

.checkout-box h2{
    color:#6b0f1a;
    margin-bottom:25px;
}

.checkout-btn{
    padding:15px 35px;
    border:none;
    background:#6b0f1a;
    color:white;
    font-size:18px;
    border-radius:8px;
    cursor:pointer;
}

.checkout-btn:hover{
    opacity:0.9;
}
@media (max-width:768px){

.navbar{
    flex-direction:column;
    padding:20px;
    gap:15px;
}

.logo{
    font-size:30px;
    text-align:center;
}

.nav-links{
    justify-content:center;
    gap:15px;
}

.main{
    padding:25px;
}

h1{
    font-size:32px;
}

.cart-card{
    flex-direction:column;
    text-align:center;
}

.cart-card img{
    width:250px;
    height:250px;
}

.cart-info{
    width:100%;
}

.quantity-box{
    justify-content:center;
}

.checkout-box{
    padding:25px;
}

.checkout-btn{
    width:100%;
}

}
@media (max-width:480px){

.navbar{
    padding:18px;
}

.logo{
    font-size:28px;
}

.nav-links{
    flex-direction:column;
    align-items:center;
    gap:10px;
}

.main{
    padding:15px;
}

h1{
    font-size:28px;
}

.cart-card{
    padding:15px;
}

.cart-card img{
    width:100%;
    max-width:250px;
    height:auto;
}

.cart-info h2{
    font-size:22px;
}

.cart-info p{
    font-size:16px;
}

.quantity-box{
    gap:10px;
}

.qty-btn{
    width:36px;
    height:36px;
    font-size:18px;
}

.qty-number{
    font-size:18px;
}

.total{
    font-size:18px;
}

.remove-btn{
    width:100%;
    text-align:center;
}

.checkout-box{
    padding:20px;
}

.checkout-box h2{
    font-size:24px;
}

.checkout-btn{
    width:100%;
    font-size:16px;
}

}

</style>

</head>

<body>
<div class="navbar">

    <div class="logo">

        Aadhya Vastra

    </div>

    <div class="nav-links">

        <a href="{% url 'userindex' %}">
            Home
        </a>

        <a href="{% url 'products' %}">
            Products
        </a>

        <a href="{% url 'cart' %}">
            Cart
        </a>

        <a href="{% url 'orders' %}">
            Orders
        </a>

        <a href="{% url 'profile' %}">
            Profile
        </a>

        <a href="{% url 'logout' %}">
            Logout
        </a>

    </div>

</div>
<div class="main">

    <h1>My Cart</h1>

    <div class="cart-container">

        {% for item in cart_items %}

        <div class="cart-card">

            <img src="{{ item.product.image }}">

            <div class="cart-info">

                <h2>

                    {{ item.product.name }}

                </h2>

                <p>

                    Price : ₹ {{ item.product.price }}

                </p>
                <div class="quantity-box">

                    <a href="{% url 'decrease_quantity' item.id %}"
                       class="qty-btn">

                       -

                    </a>

                    <span class="qty-number">

                        {{ item.quantity }}

                    </span>

                    <a href="{% url 'increase_quantity' item.id %}"
                       class="qty-btn">

                       +

                    </a>

                </div>
                <p class="total">

                    Total :

                    ₹ {{ item.total }}

                </p>
                <a href="{% url 'remove_cart' item.id %}"
                   class="remove-btn">

                   Remove

                </a>

            </div>

        </div>

        {% endfor %}

    </div>
    <div class="checkout-box">

        <h2>

            Grand Total : ₹ {{ grand_total }}

        </h2>

        <a href="{% url 'paymentpage' %}">

            <button class="checkout-btn">

                Proceed To Payment

            </button>

        </a>

    </div>

</div>

</body>
</html>
