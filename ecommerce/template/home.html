{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Aadhya Vastra</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial, Helvetica, sans-serif;
background:#fdf9f6;
}

/* Navbar */

.navbar{

display:flex;
justify-content:space-between;
align-items:center;

padding:18px 70px;

background:#6b0f1a;
color:white;

}

.logo{

font-size:34px;
font-family:Georgia, serif;
font-weight:bold;
line-height:1.1;

}

.nav-links{

display:flex;
gap:25px;

}

.nav-links a{

text-decoration:none;
color:white;
font-size:17px;
transition:.3s;

}

.nav-links a:hover{

opacity:.7;

}

/* Hero */

.container{

display:flex;
justify-content:space-between;
align-items:center;

padding:70px;

gap:50px;

}

.text-section{

flex:1;

}

.text-section h1{

font-size:60px;
color:#6b0f1a;
font-family:Georgia, serif;
line-height:1.2;
margin-bottom:20px;

}

.text-section p{

font-size:20px;
color:#555;
line-height:1.8;

}

.hero{

flex:1;
height:550px;

position:relative;

overflow:hidden;

border-radius:15px;

}

.hero-slide{

position:absolute;
width:100%;
height:100%;

opacity:0;
transition:1s;

}

.hero-slide.active{

opacity:1;

}

.hero-slide img{

width:100%;
height:100%;
object-fit:cover;

}

.hero::after{

content:"";
position:absolute;
top:0;
left:0;

width:100%;
height:100%;

background:rgba(0,0,0,.15);

}

/* Categories */

.categories{

padding:70px;

}

.categories h2{

text-align:center;

font-size:40px;

font-family:Georgia, serif;

margin-bottom:40px;

color:#6b0f1a;

}

.category-grid{

display:flex;
justify-content:center;
gap:30px;
flex-wrap:wrap;

}

.card{

width:300px;

background:white;

border-radius:12px;

overflow:hidden;

box-shadow:0 5px 15px rgba(0,0,0,.15);

transition:.3s;

cursor:pointer;

}

.card:hover{

transform:translateY(-8px);

}

.card img{

width:100%;
height:340px;
object-fit:cover;

}

.card h3{

padding:18px;

text-align:center;

font-size:22px;

}

/* Footer */

.footer{

margin-top:60px;

background:#6b0f1a;

color:white;

padding:20px;

text-align:center;

}

/* Responsive */

@media(max-width:992px){

.container{

flex-direction:column;

padding:40px 25px;

text-align:center;

}

.text-section{

width:100%;

}

.text-section h1{

font-size:48px;

}

.hero{

width:100%;
height:450px;

}

.navbar{

padding:20px;

flex-direction:column;

gap:20px;

}

.logo{

font-size:30px;

}

.nav-links{

flex-wrap:wrap;

justify-content:center;

}

}

@media(max-width:576px){

.text-section h1{

font-size:40px;

}

.text-section p{

font-size:18px;

}

.hero{

height:380px;

}

.categories{

padding:40px 20px;

}

.categories h2{

font-size:32px;

}

.card{

width:100%;

max-width:330px;

}

}

</style>

</head>

<body>

<div class="navbar">

<div class="logo">
Aadhya<br>Vastra
</div>

<div class="nav-links">

<a href="/">Home</a>

<a href="{% url 'login' %}">Login</a>

<a href="{% url 'register' %}">Register</a>

</div>

</div>

<div class="container">

<div class="text-section">

<h1>Elegance in Every Thread</h1>

<p>Where tradition meets modern style.</p>

<p>Discover timeless beauty crafted for every woman.</p>

</div>

<div class="hero">

<div class="hero-slide active">

<img src="https://www.manyavar.com/dw/image/v2/BJZV_PRD/on/demandware.static/-/Library-Sites-ManyavarSharedLibrary/default/dwfea3fed7/manyavar%20images%20m/51793/The%20Evolution%20of%20Saree%20Fashion%20From%20Classic%20to%20Contemporary_blog%201.jpg">

</div>

<div class="hero-slide">

</div>

</div>

<div class="footer">

<p>© 2026 Aadhya Vastra | All Rights Reserved</p>

</div>

<script>

let slides=document.querySelectorAll(".hero-slide");

let index=0;

setInterval(()=>{

slides[index].classList.remove("active");

index=(index+1)%slides.length;

slides[index].classList.add("active");

},3000);

</script>

</body>
</html>
