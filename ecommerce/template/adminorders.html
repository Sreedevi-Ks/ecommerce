<!DOCTYPE html>
<html>
<head>

<title>Admin Orders</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#f5f1ee;
}
.sidebar{
    width:220px;
    height:100vh;
    background:#6b0f1a;
    color:white;
    position:fixed;
    top:0;
    left:0;
    padding:20px;
    overflow-y:auto;
}

.sidebar h2{
    text-align:center;
    margin-bottom:35px;
    font-family:Georgia, "Times New Roman", serif;
}

.sidebar a{
    display:block;
    color:white;
    text-decoration:none;
    padding:12px;
    margin:10px 0;
    border-radius:6px;
    transition:0.3s;
}

.sidebar a:hover{
    background:rgba(255,255,255,0.15);
    padding-left:18px;
}
.main{
    margin-left:220px;
    padding:30px;
}

.main h1{
    color:#6b0f1a;
    margin-bottom:25px;
    text-align:center;
    font-family:Georgia, "Times New Roman", serif;
}
.table-container{
    width:100%;
    overflow-x:auto;
}

table{
    width:100%;
    min-width:800px;
    border-collapse:collapse;
    background:white;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
    border-radius:10px;
    overflow:hidden;
}

th,
td{
    border:1px solid #ddd;
    padding:12px;
    text-align:center;
}

th{
    background:#6b0f1a;
    color:white;
}

tr:nth-child(even){
    background:#fafafa;
}

img{
    width:80px;
    height:80px;
    object-fit:cover;
    border-radius:6px;
}
@media(max-width:768px){

.sidebar{
    position:relative;
    width:100%;
    height:auto;
    display:flex;
    flex-direction:column;
    align-items:center;
}

.sidebar h2{
    margin-bottom:20px;
}

.sidebar a{
    width:100%;
    text-align:center;
}

.main{
    margin-left:0;
    padding:20px;
}

.main h1{
    font-size:30px;
}

}
@media(max-width:480px){

.sidebar{
    padding:15px;
}

.sidebar h2{
    font-size:24px;
}

.sidebar a{
    font-size:15px;
    padding:10px;
}

.main{
    padding:15px;
}

.main h1{
    font-size:26px;
}

table{
    min-width:700px;
}

th,
td{
    padding:10px;
    font-size:14px;
}

img{
    width:60px;
    height:60px;
}

}
</style>

</head>

<body>

<div class="sidebar">

    <h2>Admin Panel</h2>

    <a href="{% url 'adminhome' %}">Home</a>

    <a href="{% url 'addproduct' %}">Add Product</a>

    <a href="{% url 'adminorders' %}">Orders</a>

    <a href="{% url 'logout' %}">Logout</a>

</div>

<div class="main">

    <h1>All Orders</h1>

    <table>

        <tr>

            <th>User</th>

            <th>Product</th>

            <th>Image</th>

            <th>Quantity</th>

            <th>Total</th>

            <th>Payment</th>

            <th>Status</th>

        </tr>

        {% for order in orders %}

        <tr>

            <td>{{ order.user.email }}</td>

            <td>{{ order.product.name }}</td>

            <td>
                <img src="{{ order.product.image }}">
            </td>

            <td>{{ order.quantity }}</td>

            <td>₹ {{ order.total }}</td>

            <td>{{ order.payment_method }}</td>

            <td>{{ order.status }}</td>

        </tr>

        {% endfor %}

    </table>

</div>

</body>
</html>
