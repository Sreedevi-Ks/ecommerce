<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Orders - Aadhya Vastra</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#fdf9f6;
}

/* Navbar */

.navbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px 60px;
    background:#6b0f1a;
    color:white;
}

.logo{
    font-size:32px;
    font-family:Georgia, serif;
    font-weight:bold;
    line-height:1.1;
}

.nav-links{
    display:flex;
    gap:25px;
}

.nav-links a{
    text-decoration:none;
    color:white;
    font-size:16px;
    transition:0.3s;
}

.nav-links a:hover{
    opacity:0.8;
}

/* Heading */

h1{
    text-align:center;
    color:#6b0f1a;
    margin:40px 0;
    font-family:Georgia, serif;
}

/* Orders */

.order-container{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:30px;
    padding:20px;
}

.order-card{
    width:300px;
    background:white;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
    transition:0.3s;
}

.order-card:hover{
    transform:translateY(-5px);
}

.order-card img{
    width:100%;
    height:320px;
    object-fit:cover;
}

.order-info{
    padding:20px;
}

.order-info h3{
    color:#6b0f1a;
    margin-bottom:15px;
}

.order-info p{
    margin:10px 0;
    color:#555;
}

/* Footer */

.footer{
    background:#6b0f1a;
    color:white;
    text-align:center;
    padding:18px;
    margin-top:40px;
}

/* Tablet */

@media(max-width:768px){

.navbar{
    flex-direction:column;
    padding:20px;
    gap:15px;
}

.logo{
    text-align:center;
    font-size:30px;
}

.nav-links{
    flex-wrap:wrap;
    justify-content:center;
    gap:15px;
}

.order-card{
    width:90%;
    max-width:350px;
}

}

/* Mobile */

@media(max-width:480px){

.logo{
    font-size:28px;
}

.nav-links{
    flex-direction:column;
    align-items:center;
    gap:10px;
}

h1{
    font-size:30px;
}

.order-card img{
    height:250px;
}

}

</style>

</head>

<body>

<div class="navbar">

    <div class="logo">
        Aadhya<br>Vastra
    </div>

    <div class="nav-links">

        <a href="{% url 'userindex' %}">Home</a>

        <a href="{% url 'products' %}">Products</a>

        <a href="{% url 'cart' %}">Cart</a>

        <a href="{% url 'profile' %}">Profile</a>

        <a href="{% url 'logout' %}">Logout</a>

    </div>

</div>

<h1>My Orders</h1>

<div class="order-container">

{% for order in orders %}

<div class="order-card">

    <img src="{{ order.product.image }}" alt="{{ order.product.name }}">

    <div class="order-info">

        <h3>{{ order.product.name }}</h3>

        <p><strong>Quantity:</strong> {{ order.quantity }}</p>

        <p><strong>Total:</strong> ₹ {{ order.total }}</p>

        <p><strong>Status:</strong> {{ order.status }}</p>

    </div>

</div>

{% empty %}

<h3>No Orders Found</h3>

{% endfor %}

</div>

<div class="footer">

    © 2026 Aadhya Vastra | All Rights Reserved

</div>

</body>
</html>
